name: Deploy to Coolify

# Triggers a Coolify deploy on every push to main.
# Required GitHub Actions secrets (repo → Settings → Secrets and variables → Actions):
#   COOLIFY_WEBHOOK_URL  — REQUIRED. Coolify → App → Webhooks → Deploy webhook URL.
#                          Coolify webhooks already include the deploy UUID/token in the URL,
#                          so this alone is normally sufficient.
#   COOLIFY_API_TOKEN    — OPTIONAL. Only needed if you use the Coolify API endpoint
#                          (https://<coolify>/api/v1/deploy?uuid=...) instead of a webhook URL.
#
# The workflow is defensive: it validates secrets, prints the HTTP status,
# retries transient failures, and never fails silently.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL secret is not set."
            echo "Set it in: repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Webhook URL host: $(echo "$COOLIFY_WEBHOOK_URL" | awk -F/ '{print $3}')"

      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN:   ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set +u
          AUTH_ARGS=()
          if [ -n "${COOLIFY_API_TOKEN}" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${COOLIFY_API_TOKEN}")
            echo "🔐 Using Bearer token auth."
          else
            echo "ℹ️  No COOLIFY_API_TOKEN — relying on token embedded in webhook URL."
          fi

          call_coolify() {
            local method="$1"
            echo "→ ${method} $(echo "${COOLIFY_WEBHOOK_URL}" | sed -E 's/(token=|uuid=)[^&]+/\1***/g')"
            curl -sS -o /tmp/coolify.out -w "%{http_code}" \
              --connect-timeout 15 --max-time 60 \
              -X "${method}" "${COOLIFY_WEBHOOK_URL}" "${AUTH_ARGS[@]}" 2>/tmp/coolify.err || echo "000"
          }

          print_response() {
            echo "── Response body ──"
            head -c 2000 /tmp/coolify.out 2>/dev/null || true
            echo
            if [ -s /tmp/coolify.err ]; then
              echo "── curl stderr ──"
              head -c 1000 /tmp/coolify.err
              echo
            fi
            echo "───────────────────"
          }

          attempt=1
          max_attempts=3
          while :; do
            echo "══ Attempt ${attempt}/${max_attempts} (GET) ══"
            http_code=$(call_coolify GET)
            echo "HTTP status: ${http_code}"
            print_response

            case "$http_code" in
              2*)
                echo "✅ Coolify deploy triggered."
                exit 0 ;;
              405|400)
                echo "↻ Server rejected GET (${http_code}) — retrying with POST."
                http_code=$(call_coolify POST)
                echo "HTTP status: ${http_code}"
                print_response
                case "$http_code" in
                  2*) echo "✅ Coolify deploy triggered (POST)."; exit 0 ;;
                  *)  echo "::error::Coolify rejected both GET and POST (last ${http_code})."; exit 1 ;;
                esac
                ;;
              401|403|404)
                echo "::error::Coolify rejected the request (${http_code}). Verify COOLIFY_WEBHOOK_URL (and COOLIFY_API_TOKEN if used). No retry will help."
                exit 1 ;;
              000|5*|429)
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "::error::Coolify unreachable after ${max_attempts} attempts (last ${http_code})."
                  exit 1
                fi
                sleep_for=$(( attempt * 10 ))
                echo "⏳ Transient failure — sleeping ${sleep_for}s."
                sleep "$sleep_for"
                attempt=$(( attempt + 1 )) ;;
              *)
                echo "::error::Unexpected status ${http_code} from Coolify."
                exit 1 ;;
            esac
          done
